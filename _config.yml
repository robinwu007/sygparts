# SYGPARTS site configuration
# 站点主体为静态 HTML（index.html / catalog.html），Jekyll 仅托管 404 与静态资源，
# 不再使用博客/文章/分页/搜索能力。

title: SYGPARTS
tagline: One RFQ. Better China sourcing.
description: >-
  China auto parts sourcing for importers, distributors, e-commerce sellers and
  commercial-vehicle specialists. Supplier comparison, QC coordination and
  multi-supplier consolidation from one point of contact.
url: https://www.sygparts.com
baseurl: ""
email: info@sygparts.com
timezone: Asia/Shanghai
lang: en

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

plugins:
  - jekyll-include-cache

defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
      share: false
      related: false

author:
  name: "SYGPARTS"
  bio: "China auto parts sourcing & supply chain integration."

footer:
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://www.sygparts.com"
    - label: "WhatsApp"
      icon: "fab fa-fw fa-whatsapp"
      url: "https://wa.me/8618358487817"
